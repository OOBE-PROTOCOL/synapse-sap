name: SAP Program Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "program-v*"

env:
  AGAVE_VERSION: "3.1.10"
  ANCHOR_VERSION: "1.0.0"
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Build signed-off program artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Install Agave CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Local release gates
        run: |
          yarn verify:idl:checked-in
          cargo fmt --check
          yarn lint

      - name: Build program
        run: anchor build --ignore-keys

      - name: Verify generated IDL
        run: yarn verify:idl

      - name: Prepare release artifact checksums
        run: |
          mkdir -p release-artifacts
          cp target/deploy/synapse_agent_sap.so release-artifacts/
          cp target/idl/synapse_agent_sap.json release-artifacts/
          cp target/types/synapse_agent_sap.ts release-artifacts/
          (cd release-artifacts && sha256sum synapse_agent_sap.so synapse_agent_sap.json synapse_agent_sap.ts > SHA256SUMS)
          cat release-artifacts/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sap-program-release-artifacts
          path: release-artifacts/
          if-no-files-found: error
